<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="ivoryVeil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f1e8" stop-opacity="0.93"/>
      <stop offset="0.5" stop-color="#eee3d4" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#e4d6c7" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="37%" r="66%">
      <stop offset="0" stop-color="#fffaf4" stop-opacity="0.82"/>
      <stop offset="0.63" stop-color="#f8f1e8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#cf8b6e" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2aa59"/>
      <stop offset="0.32" stop-color="#855d1d"/>
      <stop offset="0.62" stop-color="#73501b"/>
      <stop offset="1" stop-color="#c69845"/>
    </linearGradient>
    <pattern id="grain" width="52" height="52" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="12" r="1.1" fill="#ad5c3d" opacity="0.12"/>
      <circle cx="34" cy="39" r="0.9" fill="#956d25" opacity="0.09"/>
    </pattern>
    <filter id="soften" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.5"/>
      <feColorMatrix type="saturate" values="0.45"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#fffaf4" flood-opacity="0.95"/>
    </filter>
    <style>
      .ar { font-family: 'Noto Naskh Arabic', 'Amiri', serif; direction: rtl; unicode-bidi: bidi-override; text-anchor: middle; }
      .taupe { fill: #5c5048; }
      .goldText { fill: #855d1d; }
      .terraText { fill: #ad5c3d; }
      .small { font-size: 34px; font-weight: 500; }
      .body { font-size: 42px; font-weight: 500; }
      .detail { font-size: 45px; font-weight: 600; }
    </style>
  </defs>

  <image x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid slice"
         xlink:href="uploads/Chateau_Versailles_Galerie_des_Glaces.jpg" opacity="0.42" filter="url(#soften)"/>
  <rect width="1080" height="1350" fill="url(#ivoryVeil)"/>
  <rect width="1080" height="1350" fill="url(#light)"/>
  <rect width="1080" height="1350" fill="url(#grain)"/>

  <!-- Quiet royal frame, echoing the website's double gold border. -->
  <rect x="30" y="30" width="1020" height="1290" rx="2" fill="none" stroke="#956d25" stroke-width="2.2" opacity="0.74"/>
  <rect x="43" y="43" width="994" height="1264" rx="2" fill="none" stroke="#d2aa59" stroke-width="1" opacity="0.68"/>
  <path d="M30 145V30H145 M935 30h115v115 M30 1205v115h115 M935 1320h115v-115" fill="none" stroke="#ad5c3d" stroke-width="3" opacity="0.78"/>
  <path d="M54 106c29 0 52-23 52-52M974 54c0 29 23 52 52 52M54 1244c29 0 52 23 52 52M974 1296c0-29 23-52 52-52" fill="none" stroke="#c69845" stroke-width="1.5" opacity="0.7"/>
  <g fill="#ad5c3d" opacity="0.72">
    <path d="M78 42l8 8-8 8-8-8z"/><path d="M1002 42l8 8-8 8-8-8z"/>
    <path d="M78 1292l8 8-8 8-8-8z"/><path d="M1002 1292l8 8-8 8-8-8z"/>
  </g>

  <!-- Monogram medallion. -->
  <circle cx="540" cy="147" r="72" fill="#f8f1e8" fill-opacity="0.42" stroke="#ad5c3d" stroke-width="1.8"/>
  <circle cx="540" cy="147" r="62" fill="none" stroke="#d2aa59" stroke-width="1" opacity="0.72"/>
  <image x="510" y="99" width="60" height="94" preserveAspectRatio="xMidYMid meet"
         xlink:href="ali-zahraa-day-logo.png"/>
  <g fill="#ad5c3d">
    <path d="M522 61l7 7-7 7-7-7z"/><path d="M540 54l9 9-9 9-9-9z"/><path d="M558 61l7 7-7 7-7-7z"/>
  </g>

  <text x="540" y="264" class="ar taupe small" filter="url(#shadow)">برفقة عائلتينا</text>

  <g stroke="url(#gold)" fill="none" opacity="0.82">
    <path d="M268 298H442 M638 298h174" stroke-width="1.5"/>
    <path d="M460 298h28 M592 298h28" stroke-width="2"/>
  </g>
  <g fill="#ad5c3d">
    <path d="M500 298l8 8 8-8-8-8z"/><path d="M564 298l8 8 8-8-8-8z"/>
  </g>

  <text x="540" y="365" class="ar taupe body" filter="url(#shadow)">وَجَعَلَ بَيْنَكُم مَوَدَّةً وَرَحْمَةً</text>
  <text x="540" y="427" class="ar goldText small">الروم ٢١</text>

  <text x="540" y="512" class="ar taupe body" filter="url(#shadow)">نتشرّف بدعوتكم لمشاركتنا</text>
  <text x="540" y="565" class="ar taupe body" filter="url(#shadow)">فرحة كتب كتابنا</text>

  <text x="540" y="692" class="ar terraText" font-family="'Noto Naskh Arabic', 'Amiri', serif" font-size="104" font-weight="700"
        direction="rtl" unicode-bidi="bidi-override" text-anchor="middle" filter="url(#shadow)">علي وزهراء</text>

  <g stroke="url(#gold)" fill="none">
    <path d="M308 739H487 M593 739h179" stroke-width="1.7"/>
    <circle cx="540" cy="739" r="5" stroke-width="1.4"/>
    <path d="M519 739l8 8 8-8-8-8zM561 739l-8 8-8-8 8-8z" stroke-width="1.2"/>
  </g>

  <text x="540" y="819" class="ar taupe detail" filter="url(#shadow)">الثلاثاء، ٦ تشرين الأول ٢٠٢٦</text>
  <text x="540" y="891" class="ar goldText" font-family="'Noto Naskh Arabic', 'Amiri', serif" font-size="54" font-weight="700"
        direction="rtl" unicode-bidi="bidi-override" text-anchor="middle" filter="url(#shadow)">الساعة السادسة والنصف مساءً</text>

  <g transform="translate(188 932)">
    <rect x="0" y="0" width="704" height="168" rx="3" fill="#f8f1e8" fill-opacity="0.5" stroke="#956d25" stroke-width="1.5"/>
    <rect x="10" y="10" width="684" height="148" rx="1" fill="none" stroke="#d2aa59" stroke-width="0.8" opacity="0.84"/>
    <path d="M0 34h34V0 M670 0v34h34 M0 134h34v34 M670 168v-34h34" fill="none" stroke="#ad5c3d" stroke-width="2"/>
    <text x="352" y="74" fill="#5c5048" font-family="Georgia, 'Times New Roman', serif" font-size="57" font-weight="600" text-anchor="middle">Lecial</text>
    <text x="352" y="130" class="ar taupe detail">صربا، لبنان</text>
  </g>

  <g fill="#ad5c3d" opacity="0.86" transform="translate(540 1145)">
    <path d="M0-23c7 10 17 17 29 21C17 2 7 9 0 19-7 9-17 2-29-2-17-6-7-13 0-23z" fill="none" stroke="#ad5c3d" stroke-width="1.8"/>
    <circle cx="0" cy="-2" r="3"/>
  </g>
  <text x="540" y="1220" class="ar taupe body" filter="url(#shadow)">حضوركم هو أجمل هدية لنا</text>
  <text x="540" y="1270" class="ar goldText small">مع كل محبتنا</text>
</svg>
